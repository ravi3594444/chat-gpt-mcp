[package]
name = "browser-link-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws", "form"] }
tokio = { version = "1", features = ["full"] }
rmcp = { version = "3.5.1", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
url = "2"
subtle = "2"

